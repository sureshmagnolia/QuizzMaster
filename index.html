<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizzMaster | Setup Wizard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="brand">QuizzMaster ✨</div>
        <div style="display: flex; gap: 10px;">
            <input type="file" id="importFile" style="display:none" accept=".json">
            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 Import JSON</button>
            <button class="btn btn-secondary" onclick="exportConfig()">📤 Export JSON</button>
            <button class="btn btn-primary" onclick="launchQuiz()">🚀 Launch Quiz</button>
        </div>
    </header>

    <main class="animate-fade-in">
        <div class="setup-grid">
            <div class="glass-panel">
                <h2 style="margin-bottom: 20px;">⚙️ Global Settings</h2>
                <div class="form-group">
                    <label>Quiz Title</label>
                    <input type="text" id="quizTitle" placeholder="e.g. The Grand Pub Quiz 2026">
                </div>
                <div class="form-group">
                    <label>Number of Teams</label>
                    <select id="teamCount" onchange="generateTeamInputs()">
                        <option value="2">2 Teams</option>
                        <option value="3">3 Teams</option>
                        <option value="4" selected>4 Teams</option>
                        <option value="5">5 Teams</option>
                        <option value="6">6 Teams</option>
                        <option value="8">8 Teams</option>
                        <option value="10">10 Teams</option>
                    </select>
                </div>
            </div>

            <div class="glass-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>👥 Team Roster</h2>
                </div>
                <div id="teamsContainer" class="teams-list"></div>
            </div>
        </div>

        <div class="glass-panel" style="margin-top: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>🎪 Round Builder</h2>
                <button class="btn btn-secondary" onclick="addRound()">➕ Add Round</button>
            </div>
            <div id="roundsContainer" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;"></div>
        </div>
    </main>

    <!-- Question Builder Modal -->
    <div id="qModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalRoundTitle">Edit Questions</h2>
                <button class="btn btn-secondary" onclick="closeModal()" style="padding: 5px 10px;">✕</button>
            </div>
            <div class="modal-body">
                <div id="questionsList"></div>
                
                <div style="background: rgba(15,23,42,0.8); padding: 20px; border-radius: 8px; margin-top: 20px;">
                    <h3>Add New Question</h3>
                    <div class="form-group" style="margin-top: 15px;">
                        <label>Question Text</label>
                        <textarea id="newQText" placeholder="What is the capital of France?"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Question Media (Optional YouTube ID or Image URL)</label>
                        <input type="text" id="newQMedia" placeholder="e.g. dQw4w9WgXcQ (YT ID) or https://img.url">
                    </div>
                    
                    <div class="form-group" style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                        <label>Answer Text</label>
                        <textarea id="newAText" placeholder="Paris"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Answer Media (Optional YouTube ID or Image URL)</label>
                        <input type="text" id="newAMedia" placeholder="e.g. dQw4w9WgXcQ (YT ID) or https://img.url">
                    </div>
                    <button class="btn btn-primary" style="width: 100%;" onclick="saveNewQuestion()">➕ Save Question</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Done</button>
            </div>
        </div>
    </div>

    <script src="js/setup.js"></script>
</body>
</html>
