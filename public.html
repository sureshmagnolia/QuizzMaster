<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizzMaster | Public Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        
        .header {
            padding: 20px 50px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.4); border-bottom: 2px solid rgba(255,255,255,0.1);
            height: 90px;
        }
        
        .quiz-title { font-size: 2rem; font-weight: 900; background: linear-gradient(to right, #6366F1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 2px; }
        .round-info { text-align: right; }
        .round-info h2 { font-size: 1.8rem; font-weight: 800; }
        .round-info p { font-size: 1rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        .main-stage {
            flex: 1; display: flex; overflow: hidden;
        }

        /* Split Screen Layout */
        .q-panel {
            flex: 1; padding: 40px; display: flex; align-items: center; justify-content: center;
            border-right: 2px solid rgba(255,255,255,0.1);
        }
        .lb-panel {
            width: 400px; padding: 30px; background: rgba(0,0,0,0.2); overflow-y: auto;
        }

        /* Leaderboard */
        .lb-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
        .lb-row {
            display: flex; align-items: center; background: rgba(30, 41, 59, 0.8);
            border-radius: 12px; padding: 15px 20px; border-left: 6px solid var(--t-color);
            margin-bottom: 12px; transition: all 0.3s ease;
        }
        .lb-row:nth-child(2) { transform: scale(1.05); background: rgba(255,215,0,0.1); border-left-color: gold; box-shadow: 0 0 20px rgba(255,215,0,0.2); margin-bottom: 20px;}
        .lb-row:nth-child(3) { background: rgba(192,192,192,0.1); }
        .lb-row:nth-child(4) { background: rgba(205,127,50,0.1); }
        .lb-rank { font-size: 1.2rem; font-weight: 900; width: 40px; color: rgba(255,255,255,0.3); }
        .lb-name { flex: 1; font-size: 1.5rem; font-weight: 800; }
        .lb-score { font-size: 2rem; font-weight: 900; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        /* Question View */
        .q-container { width: 100%; max-width: 900px; text-align: center; }
        .q-text { font-size: 2.5rem; font-weight: 800; line-height: 1.3; margin-bottom: 30px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .a-text { font-size: 2.2rem; font-weight: 800; color: #10b981; margin-top: 30px; display: none; animation: slideUp 0.5s ease; }
        .media-box { margin: 20px auto; max-width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .media-box img, .media-box video, .media-box iframe { width: 100%; max-height: 55vh; object-fit: contain; display: block; border: none; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="quiz-title" id="pubTitle">QuizzMaster Live</div>
        <div class="round-info">
            <h2 id="pubRoundName">Loading...</h2>
            <p id="pubRoundType">Waiting for QM</p>
        </div>
    </div>

    <div class="main-stage">
        <!-- Question Area (Left) -->
        <div class="q-panel" id="qView">
            <div class="q-container">
                <div class="q-text" id="qText">Waiting for Question...</div>
                <div class="media-box" id="mediaContainer"></div>
                <div class="a-text" id="aText"></div>
            </div>
        </div>

        <!-- Leaderboard Area (Right) -->
        <div class="lb-panel">
            <div class="lb-title">🏆 Live Scores</div>
            <div id="lbView">
                <!-- Injected by JS -->
            </div>
        </div>
    </div>

    <script src="js/public.js"></script>
</body>
</html>
