<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizzMaster | Public Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        
        .header {
            padding: 20px 50px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.4); border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        
        .quiz-title { font-size: 2rem; font-weight: 900; background: linear-gradient(to right, #6366F1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 2px; }
        .round-info { text-align: right; }
        .round-info h2 { font-size: 1.8rem; font-weight: 800; }
        .round-info p { font-size: 1rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }

        .main-stage {
            flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; position: relative;
        }

        .view-panel { display: none; width: 100%; max-width: 1200px; flex-direction: column; gap: 15px; animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .view-panel.active { display: flex; }

        /* Leaderboard */
        .lb-row {
            display: flex; align-items: center; background: rgba(30, 41, 59, 0.8);
            border-radius: 16px; padding: 20px 40px; border-left: 8px solid var(--t-color);
            transform-origin: left; transition: all 0.3s ease;
        }
        .lb-row:nth-child(1) { transform: scale(1.05); background: rgba(255,215,0,0.1); border-left-color: gold; box-shadow: 0 0 40px rgba(255,215,0,0.2); }
        .lb-row:nth-child(2) { background: rgba(192,192,192,0.1); }
        .lb-row:nth-child(3) { background: rgba(205,127,50,0.1); }
        .lb-rank { font-size: 2rem; font-weight: 900; width: 60px; color: rgba(255,255,255,0.3); }
        .lb-name { flex: 1; font-size: 2.5rem; font-weight: 800; }
        .lb-score { font-size: 3.5rem; font-weight: 900; color: #fff; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* Question View */
        .q-container { background: rgba(0,0,0,0.4); padding: 40px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .q-text { font-size: 3.5rem; font-weight: 800; line-height: 1.3; margin-bottom: 30px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .a-text { font-size: 3rem; font-weight: 800; color: #10b981; margin-top: 30px; display: none; animation: slideUp 0.5s ease; }
        .media-box { margin: 20px auto; max-width: 80%; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .media-box img, .media-box iframe { width: 100%; max-height: 50vh; object-fit: contain; display: block; border: none; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="quiz-title" id="pubTitle">QuizzMaster Live</div>
        <div class="round-info">
            <h2 id="pubRoundName">Loading...</h2>
            <p id="pubRoundType">Waiting for QM</p>
        </div>
    </div>

    <div class="main-stage">
        
        <div class="view-panel active" id="lbView"></div>
        
        <div class="view-panel" id="qView">
            <div class="q-container">
                <div class="q-text" id="qText"></div>
                <div class="media-box" id="mediaContainer"></div>
                <div class="a-text" id="aText"></div>
            </div>
        </div>
        
    </div>

    <script src="js/public.js"></script>
</body>
</html>
